<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome - Microsoft Security Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Reset בסיסי */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background:
                linear-gradient(135deg, rgba(28,146,210,0.85), rgba(242,252,254,0.85)),
                url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
            text-align: center;
            padding: 20px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            max-width: 480px;
            width: 100%;
            padding: 50px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(28, 146, 210, 0.3);
            animation: fadeInScale 0.7s ease forwards;
            position: relative;
        }

        .icon-shield {
            font-size: 64px;
            color: #1c92d2;
            margin-bottom: 15px;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.7; transform: scale(1.05);}
        }

        h1 {
            font-weight: 800;
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #0f172a;
        }

        p {
            font-size: 1.15rem;
            margin-bottom: 40px;
            color: #334155;
            line-height: 1.5;
        }

        a.button {
            background-color: #1c92d2;
            color: white;
            padding: 16px 44px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 8px 15px rgba(28, 146, 210, 0.3);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        a.button:hover, a.button:focus {
            background-color: #155a8a;
            box-shadow: 0 12px 25px rgba(21, 90, 138, 0.5);
            outline: none;
        }

        a.button svg, a.button .fa-arrow-right {
            margin-left: 12px;
            width: 22px;
            height: 22px;
            fill: white;
            transition: transform 0.3s ease;
        }

        a.button:hover svg, a.button:hover .fa-arrow-right {
            transform: translateX(6px);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>
</head>
<body>
    <main class="container" role="main" aria-label="Welcome Section">
        <i class="fas fa-shield-alt icon-shield" aria-hidden="true"></i>
        <h1>Welcome to the Microsoft Security Classifier</h1>
        <p>Analyze security updates quickly and easily. Click below to start predicting based on security data.</p>
        <a href="/predict" class="button" role="button" aria-label="Start Predicting">
            Start Predicting
            <i class="fas fa-arrow-right"></i>
        </a>
    </main>
</body>
</html>
