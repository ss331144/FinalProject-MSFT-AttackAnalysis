<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Microsoft Security Attack Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="min-h-screen bg-gray-50">
    <div class="container">
        <h1>🛡️ Microsoft Security Attack Classifier</h1>
        <p>Select values and see if the model detects an attack based on the security update.</p>

        <form method="POST"> <!-- טופס שישלח בקשת POST לשרת -->
            {% for feature in features %} <!-- לולאה שעוברת על כל שם פיצ'ר -->
                <label for="{{ feature }}">{{ feature }}</label><br> <!-- תווית לפיצ'ר עם שם דינמי -->
                <select name="{{ feature }}" required> <!-- תיבת בחירה עם שם שווה לפיצ'ר, חובה למלא -->
                    {% for option in options_dict[feature] %} <!-- לולאה על כל האפשרויות לפיצ'ר זה -->
                        <option value="{{ option }}">{{ option }}</option> <!-- אופציה לבחירה, גם ערך גם תצוגה זהה -->
                    {% endfor %}
                </select><br><br> <!-- שורה ריקה בין הבחירות -->
            {% endfor %}

            <button type="submit">🔍 Predict </button> <!-- כפתור לשליחת הטופס -->
        </form>


        {% if prediction %} <!-- אם המשתנה prediction קיים ומכיל ערך -->
            <div class="result"> <!-- תיבה לעיצוב התוצאה -->
                <h2>{{ prediction }}</h2> <!-- הצגת טקסט התחזית שהשרת החזיר -->
            </div>
        {% endif %}


        <footer>
            ⚡ Built by <a href="https://github.com/ss331144" target="_blank">Sahar Yaccov</a> and <a href="https://github.com/BarCohen-dot" target="_blank">Bar Cohen</a>
        </footer>

    </div>
</body>
</html>
